<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Transformation Command Center (concept)</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#0b1630;--mut:#5b6785;--line:#e1e6f0;--nav:#0a1230;--blue:#2563ff;--teal:#00c2b2;--vio:#7c5cff;--ok:#0f9d78;--warn:#c27a00;--bad:#d6334a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#131b33;--ink:#eaf0ff;--mut:#9aa7c7;--line:#243050}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "DM Sans","Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100%}
aside{width:224px;background:linear-gradient(180deg,#0a1230,#111c4a);color:#cfd8f5;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
aside h1{font-size:15px;color:#fff;margin:0 8px 16px;line-height:1.25}aside h1 small{display:block;color:var(--teal);font-weight:500;font-size:11px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;transition:background .2s,transform .2s}
nav button:hover{background:#ffffff14;transform:translateX(2px)}nav button[aria-current=page]{background:linear-gradient(90deg,var(--blue),var(--vio));color:#fff}
nav button.soon{opacity:.55}
main{flex:1;min-width:0;padding:20px 24px 40px;position:relative}
.banner{background:#7c5cff1a;border:1px solid #7c5cff55;border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mut);margin-bottom:14px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h2{margin:0;font-size:24px;letter-spacing:-.02em}h3{margin:0 0 10px;font-size:15px}.sub{color:var(--mut);margin:2px 0 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px #0b163012}
.kpi b{display:block;font-size:28px;letter-spacing:-.02em}.kpi span{color:var(--mut);font-size:12px}
.kpi{position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--blue),var(--teal))}
button.b,select,input,textarea{font:inherit;border-radius:9px;border:1px solid var(--line);padding:7px 11px;background:var(--card);color:var(--ink)}
button.b{cursor:pointer;transition:transform .15s,box-shadow .2s}button.b:hover{transform:translateY(-1px);box-shadow:0 4px 12px #2563ff33}
button.p{background:linear-gradient(90deg,var(--blue),var(--vio));color:#fff;border:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mut);font-weight:500;font-size:12px}
.wrap{overflow-x:auto}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;background:#2563ff1a;color:var(--blue);transition:background .4s}
.tag.ok{background:#0f9d7822;color:var(--ok)}.tag.warn{background:#c27a0022;color:var(--warn)}.tag.bad{background:#d6334a22;color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.journey{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.stage{text-align:center;font-size:12px;cursor:pointer;padding:8px 2px;border-radius:10px;transition:background .2s}
.stage:hover,.stage.on{background:#2563ff14}.dot{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;color:#fff;font-weight:700;background:conic-gradient(var(--teal) var(--p),var(--line) 0)}
.dot span{background:var(--card);color:var(--ink);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:#7c8cb81a;border-radius:12px;padding:8px;min-height:140px}.col.over{outline:2px dashed var(--teal)}.col h4{margin:2px 4px 8px;font-size:12px;color:var(--mut)}
.pc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;cursor:grab;font-size:13px}
.pc small{color:var(--mut);display:block}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.st{padding:5px 10px;border-radius:99px;background:var(--line);font-size:12px;transition:all .4s}.st.done{background:var(--ok);color:#fff}.st.cur{background:var(--blue);color:#fff;animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px #2563ff22}}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--nav);color:#fff;padding:10px 14px;border-radius:10px;animation:up .3s;z-index:9}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.view{animation:fade .35s}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(520px,92vw);animation:fade .25s}dialog::backdrop{background:#0a123088}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}dialog input,dialog select,dialog textarea{width:100%}.err{color:var(--bad);font-size:12px}
svg text{fill:var(--mut);font-size:10px}
.sk{height:60px;border-radius:12px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sh 1s infinite}@keyframes sh{to{background-position:-200% 0}}
@media (max-width:820px){body{display:block}aside{width:auto;height:auto;position:static}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}.journey{grid-template-columns:repeat(4,1fr)}main{padding:14px}}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body>
<aside><h1>AI Transformation<br>Command Center<small>Concept prototype</small></h1><nav id="nav" aria-label="Main"></nav></aside>
<main><div class="banner">Concept for discussion only. All records, names and figures are fictional sample demonstration data. Not an ElephantClock.AE product, customer project or confirmed specification, and no compliance or certification is claimed.</div><div id="v"></div></main>
<dialog id="dlg"></dialog><div id="ts" aria-live="polite"></div>
<script>
const STG=["Discovery","Governance","Design","Development","Testing","Pilot","Deployment Review","Monitoring"];
const S={items:[
{id:"AI-101",name:"Invoice document triage",dept:"Finance",owner:"Role: Finance Lead",pri:"High",value:120,stage:"Development",gov:"Approved",prog:55,cat:"Document Intelligence",score:78,real:20},
{id:"AI-102",name:"Support reply drafting",dept:"Customer Service",owner:"Role: CX Manager",pri:"Medium",value:90,stage:"Pilot",gov:"Monitoring",prog:80,cat:"Customer Experience",score:72,real:45},
{id:"AI-103",name:"Internal policy search",dept:"HR",owner:"Role: HR Director",pri:"Medium",value:45,stage:"Testing",gov:"Approved",prog:70,cat:"Knowledge Management",score:66,real:8},
{id:"AI-104",name:"Demand forecasting assistant",dept:"Operations",owner:"Role: Ops Head",pri:"High",value:210,stage:"Governance",gov:"Under Review",prog:20,cat:"Data & Analytics",score:81,real:0},
{id:"AI-105",name:"Sales call summaries",dept:"Sales",owner:"Role: Sales Lead",pri:"Low",value:60,stage:"Discovery",gov:"Draft",prog:5,cat:"Sales & Marketing",score:58,real:0},
{id:"AI-106",name:"Contract clause review",dept:"Legal",owner:"Role: Legal Counsel",pri:"High",value:150,stage:"Governance",gov:"Changes Requested",prog:15,cat:"Document Intelligence",score:69,real:0}],
act:["New AI opportunity submitted: Sales call summaries","Governance assessment completed: Support reply drafting","Implementation milestone updated: Invoice document triage","Employee training completed: Responsible AI (Finance)","Business impact review scheduled: Policy search"],
adopt:[["Finance",120,82,64],["Customer Service",210,74,71],["HR",60,90,58],["Operations",180,51,33],["Sales",140,43,29],["Legal",35,66,40]],
view:"Overview",q:"",n:7};
const NAV=["Overview","Strategy","AI Opportunities","Governance","Implementation","Operating Model","Adoption","Business Value","Analytics","Reports","Settings"];
const LIVE=["Overview","AI Opportunities","Governance","Implementation","Adoption","Business Value","Reports"];
const $=s=>document.querySelector(s),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;$("#ts").append(e);setTimeout(()=>e.remove(),2600)}
function tag(s){const c=/Approved|Monitoring|Complete/.test(s)?"ok":/Review|Changes|Draft|Under/.test(s)?"warn":"";return `<span class="tag ${c}">${esc(s)}</span>`}
function bars(data,color){const m=Math.max(...data.map(d=>d[1]),1);return `<svg viewBox="0 0 300 ${data.length*24+4}" width="100%" role="img" aria-label="Bar chart">${data.map((d,i)=>`<text x="0" y="${i*24+14}">${esc(d[0])}</text><rect x="100" y="${i*24+4}" height="14" rx="4" fill="${color||"#2563ff"}" width="${RM?d[1]/m*180:0}"><animate attributeName="width" from="0" to="${d[1]/m*180}" dur=".8s" fill="freeze"/></rect><text x="${104+d[1]/m*180}" y="${i*24+15}">${d[1]}</text>`).join("")}</svg>`}
function sum(k,f){return S.items.filter(f||(()=>1)).reduce((a,b)=>a+b[k],0)}
function kpi(l,v,pre,suf){return `<div class="card kpi"><span>${l}</span><b data-n="${v}" data-pre="${pre||""}" data-suf="${suf||""}">0</b></div>`}
function count(){document.querySelectorAll("[data-n]").forEach(e=>{const t=+e.dataset.n,p=e.dataset.pre,s=e.dataset.suf;if(RM){e.textContent=p+t+s;return}let st;const f=ts=>{st=st||ts;const k=Math.min((ts-st)/800,1);e.textContent=p+Math.round(t*k)+s;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function head(t,sub,btn){return `<div class="top"><div><h2>${t}</h2><p class="sub">${sub}</p></div><div class="row">${btn||""}</div></div>`}
const V={
Overview(){const a=S.items,act=a.filter(i=>i.stage!=="Discovery"&&i.stage!=="Governance").length,pend=a.filter(i=>/Under|Changes|Submitted/.test(i.gov)).length;
const sp=[Math.min(100,60),70,62,Math.round(100*a.filter(i=>i.gov==="Approved"||i.gov==="Monitoring").length/a.length),Math.round(a.reduce((x,i)=>x+i.prog,0)/a.length),Math.round(S.adopt.reduce((x,r)=>x+r[3],0)/S.adopt.length),Math.round(100*sum("real")/sum("value"))];
const J=["Strategy","Discovery","Prioritization","Governance","Implementation","Adoption","Value Realization"];
return head("Your AI Transformation Overview","Sample demonstration data. Updates as you act in other screens.",`<select aria-label="Business unit"><option>All business units</option>${[...new Set(a.map(i=>i.dept))].map(d=>`<option>${d}</option>`)}</select><button class="b" data-a="bell">Notifications</button><button class="b p" data-a="export">Export Executive Report</button>`)+
`<div class="grid g3">${kpi("Total AI initiatives",a.length)}${kpi("Active AI projects",act)}${kpi("Opportunities under review",a.filter(i=>i.stage==="Discovery"||i.gov==="Under Review").length)}${kpi("Governance reviews pending",pend)}${kpi("AI adoption rate (sample)",sp[5],"","%")}${kpi("Estimated value (sample)",sum("value"),"$","k")}</div>
<div class="card" style="margin-top:14px"><h3>AI transformation journey (click a stage)</h3><div class="journey">${J.map((j,i)=>`<div class="stage" tabindex="0" role="button" data-a="stage" data-i="${i}"><div class="dot" style="--p:${sp[i]*3.6}deg"><span>${sp[i]}%</span></div>${j}</div>`).join("")}</div><p class="sub" id="sd">Select a stage to see what it covers.</p></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Estimated value by unit ($k, sample)</h3>${bars(S.items.map(i=>[i.dept,i.value]),"#00c2b2")}</div><div class="card"><h3>Implementation progress (%)</h3>${bars(S.items.map(i=>[i.name.slice(0,16),i.prog]),"#7c5cff")}</div></div>
<div class="card" style="margin-top:14px"><h3>AI initiative portfolio</h3>${tbl(a)}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Recent activity</h3>${S.act.slice(0,6).map(x=>`<p style="margin:6px 0">• ${esc(x)}</p>`).join("")}</div><div class="card"><h3>Executive insights (illustrative)</h3><p>${a.filter(i=>i.stage==="Discovery").length} opportunities still need prioritization.</p><p>${pend} governance reviews await a human reviewer.</p><p>${a.filter(i=>!i.real).length} initiatives have no value measurement yet.</p><div class="row"><button class="b" data-a="go" data-v="AI Opportunities">Add AI initiative</button><button class="b" data-a="go" data-v="Governance">Start governance review</button><button class="b" data-a="go" data-v="Implementation">Track implementation</button><button class="b" data-a="go" data-v="Business Value">Generate business report</button></div></div></div>`},
"AI Opportunities"(){const q=S.q.toLowerCase(),l=S.items.filter(i=>(i.name+i.dept+i.cat).toLowerCase().includes(q));
return head("Discover AI Opportunities","Identify processes, challenges and opportunities where AI could deliver meaningful business value.",`<input id="q" placeholder="Search opportunities" aria-label="Search" value="${esc(S.q)}"><button class="b p" data-a="newopp">Submit new opportunity</button>`)+
`<div class="grid g2">${l.map(i=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(i.name)}</b>${tag(i.gov)}</div><p class="sub">${esc(i.dept)} · ${esc(i.cat)} · Priority ${i.pri}</p><div class="bar" title="Score ${i.score}"><i style="width:${i.score}%"></i></div><p class="sub">Demo score ${i.score}/100 · <a href="#" data-a="score" data-id="${i.id}">Breakdown</a></p></div>`).join("")||"<p>No matches. Clear the search or submit a new opportunity.</p>"}</div><p class="sub">Scores are an illustrative framework and never replace business review.</p>`},
Governance(){const a=S.items;return head("Enterprise AI Governance Center","Visibility, accountability and human oversight. Sample records, no certification or compliance claimed.")+
`<div class="grid g3">${kpi("Registered initiatives",a.length)}${kpi("Reviews pending",a.filter(i=>/Under|Changes|Submitted/.test(i.gov)).length)}${kpi("Approved",a.filter(i=>/Approved|Monitoring/.test(i.gov)).length)}</div>
<div class="card" style="margin-top:14px"><h3>Review workflow</h3><div class="steps">${["Registration","Initial assessment","Data & privacy","Risk assessment","Human review","Approval decision","Monitoring"].map((s,i)=>`<span class="st ${i<4?"done":i==4?"cur":""}">${s}</span>`).join("")}</div><p class="sub">Approval is always recorded by a named human reviewer.</p></div>
<div class="card wrap" style="margin-top:14px"><table><tr><th>ID</th><th>Initiative</th><th>Owner</th><th>Status</th><th>Human decision</th></tr>${a.map(i=>`<tr><td>${i.id}</td><td>${esc(i.name)}</td><td>${esc(i.owner)}</td><td>${tag(i.gov)}</td><td>${/Under|Changes|Draft/.test(i.gov)?`<button class="b" data-a="approve" data-id="${i.id}">Approve</button> <button class="b" data-a="changes" data-id="${i.id}">Request changes</button>`:"Recorded"}</td></tr>`).join("")}</table></div>
<div class="card" style="margin-top:14px"><h3>Audit log</h3>${S.act.map((x,i)=>`<p style="margin:4px 0">AUD-${900+i} · ${esc(x)}</p>`).join("")}</div>`},
Implementation(){return head("AI Delivery & Implementation","Drag cards between stages, or use the Advance button. Deployment Review is a human approval stage; nothing deploys automatically.")+
`<div class="kan">${STG.map(s=>`<div class="col" data-s="${s}"><h4>${s}</h4>${S.items.filter(i=>i.stage===s).map(i=>`<div class="pc" draggable="true" data-id="${i.id}"><b>${esc(i.name)}</b><small>${esc(i.dept)} · ${i.pri}</small><div class="bar" style="margin:6px 0"><i style="width:${i.prog}%"></i></div><button class="b" data-a="adv" data-id="${i.id}">Advance</button></div>`).join("")}</div>`).join("")}</div>`},
Adoption(){return head("AI Adoption & Workforce Enablement","Fictional departments and learning records.",`<button class="b p" data-a="camp">Create training campaign</button>`)+
`<div class="grid g3">${kpi("Employees registered",S.adopt.reduce((a,r)=>a+r[1],0))}${kpi("Avg training completion",Math.round(S.adopt.reduce((a,r)=>a+r[2],0)/6),"","%")}${kpi("Avg active usage",Math.round(S.adopt.reduce((a,r)=>a+r[3],0)/6),"","%")}</div><div class="card wrap" style="margin-top:14px"><table><tr><th>Department</th><th>Enrolled</th><th>Training</th><th>Active usage</th><th>Status</th></tr>${S.adopt.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><div class="bar"><i style="width:${r[2]}%"></i></div></td><td><div class="bar"><i style="width:${r[3]}%"></i></div></td><td>${tag(r[3]>55?"On track":"Needs support")}</td></tr>`).join("")}</table></div>`},
"Business Value"(){return head("AI Business Value & ROI","Illustrative demo values. Record outcomes to update the dashboard.")+
`<div class="grid g3">${kpi("Estimated value (sample)",sum("value"),"$","k")}${kpi("Realized value (sample)",sum("real"),"$","k")}${kpi("Value realization",Math.round(100*sum("real")/sum("value")),"","%")}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Expected vs realized ($k)</h3>${bars(S.items.map(i=>[i.name.slice(0,16),i.value]),"#2563ff")}${bars(S.items.map(i=>[i.name.slice(0,16),i.real]),"#00c2b2")}</div>
<div class="card"><h3>ROI calculator</h3><label>Project investment ($)<input id="r1" type="number" value="50000"></label><label>Implementation cost ($)<input id="r2" type="number" value="20000"></label><label>Monthly operating cost ($)<input id="r3" type="number" value="2000"></label><label>Estimated monthly benefit ($)<input id="r4" type="number" value="9000"></label><label>Measurement period (months)<input id="r5" type="number" value="24"></label><div id="ro" style="margin-top:10px"></div><p class="sub">Uses your own assumptions. Not a verified financial forecast.</p></div></div>
<div class="card wrap" style="margin-top:14px"><table><tr><th>Initiative</th><th>Unit</th><th>Est. $k</th><th>Realized $k</th><th></th></tr>${S.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.dept}</td><td>${i.value}</td><td>${i.real}</td><td><button class="b" data-a="outcome" data-id="${i.id}">Record outcome</button></td></tr>`).join("")}</table></div>`},
Reports(){return head("Reports","Export a sample CSV built from the shared demo data.",`<button class="b p" data-a="export">Export CSV</button>`)+`<div class="card"><p>Includes ${S.items.length} initiatives with stage, governance status, estimated and realized value (all sample figures).</p></div>`}};
function tbl(a){return `<div class="wrap"><table><tr><th>Initiative</th><th>Department</th><th>Owner</th><th>Stage</th><th>Priority</th><th>Impact ($k)</th><th>Status</th></tr>${a.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.dept}</td><td>${esc(i.owner)}</td><td>${i.stage}</td><td>${i.pri}</td><td>${i.value}</td><td>${tag(i.gov)}</td></tr>`).join("")}</table></div>`}
function render(){$("#nav").innerHTML=NAV.map(n=>`<button class="${LIVE.includes(n)?"":"soon"}" data-a="go" data-v="${n}" ${n===S.view?'aria-current="page"':""}>${n}</button>`).join("");const v=$("#v");
if(!LIVE.includes(S.view)){v.innerHTML=head(S.view,"Not included in this first build.")+`<div class="card">This module is planned but not built in the current prototype.</div>`;return}
v.innerHTML=`<div class="grid g3"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`;setTimeout(()=>{v.innerHTML=`<div class="view">${V[S.view]()}</div>`;count();wire()},RM?0:250)}
function wire(){const q=$("#q");if(q)q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();setTimeout(()=>{const n=$("#q");n&&(n.focus(),n.setSelectionRange(p,p))},300)};
if($("#r1")){const c=()=>{const g=i=>+$("#r"+i).value||0,inv=g(1)+g(2)+g(3)*g(5),ben=g(4)*g(5),net=ben-inv,roi=inv?net/inv*100:0,pb=g(4)>g(3)?(g(1)+g(2))/(g(4)-g(3)):0;$("#ro").innerHTML=`Total investment <b>$${inv.toLocaleString()}</b><br>Net benefit <b>$${net.toLocaleString()}</b><br>Estimated ROI <b>${roi.toFixed(0)}%</b><br>Payback <b>${pb?pb.toFixed(1)+" months":"not reached"}</b>`};document.querySelectorAll("[id^=r]").forEach(e=>e.id.length==2&&(e.oninput=c));c()}
document.querySelectorAll(".pc").forEach(p=>p.ondragstart=e=>e.dataTransfer.setData("t",p.dataset.id));
document.querySelectorAll(".col").forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add("over")};c.ondragleave=()=>c.classList.remove("over");c.ondrop=e=>{e.preventDefault();mv(e.dataTransfer.getData("t"),c.dataset.s)}})}
function mv(id,s){const i=S.items.find(x=>x.id===id);if(!i)return;if(i.gov!=="Approved"&&i.gov!=="Monitoring"&&STG.indexOf(s)>1){toast("Needs human governance approval first");return}i.stage=s;i.prog=Math.max(i.prog,Math.round(STG.indexOf(s)/7*100));S.act.unshift("Implementation milestone updated: "+i.name+" → "+s);render();toast("Moved to "+s)}
const D=$("#dlg");
function form(t,fields,ok){D.innerHTML=`<h3>${t}</h3><form method="dialog" id="f">${fields}<p class="err" id="er"></p><div class="row" style="margin-top:10px"><button class="b p" value="ok">Save</button><button class="b" value="x" formnovalidate>Cancel</button></div></form>`;D.showModal();$("#f").onsubmit=e=>{if(e.submitter.value==="x")return;const f=new FormData($("#f"));if(!ok(f)){e.preventDefault()}}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id,i=S.items.find(x=>x.id===id);if(a==="go"){e.preventDefault();S.view=t.dataset.v;render()}
else if(a==="stage"){$("#sd").textContent=["Define business priorities.","Identify potential use cases.","Assess feasibility and value.","Add human review and accountability.","Track development and delivery.","Measure employee engagement.","Track business outcomes."][+t.dataset.i];document.querySelectorAll(".stage").forEach(s=>s.classList.toggle("on",s===t))}
else if(a==="bell")toast(S.items.filter(i=>/Under|Changes/.test(i.gov)).length+" reviews need a human decision");
else if(a==="export"){const csv="id,name,department,stage,governance,estimated_k,realized_k\n"+S.items.map(i=>[i.id,i.name,i.dept,i.stage,i.gov,i.value,i.real].join(",")).join("\n")+"\n(sample demonstration data)";const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));l.download="demo-report.csv";l.click();toast("Sample CSV exported")}
else if(a==="newopp")form("Submit new opportunity",`<label>Opportunity name<input name="n"></label><label>Department<select name="d">${["Finance","HR","Operations","Sales","Legal","Customer Service"].map(x=>`<option>${x}</option>`)}</select></label><label>Business challenge<textarea name="c" rows="3"></textarea></label><label>Estimated value ($k)<input name="v" type="number" value="50"></label>`,f=>{if(f.get("n").trim().length<4||f.get("c").trim().length<10){$("#er").textContent="Enter a name (4+ characters) and describe the challenge (10+ characters).";return false}S.items.push({id:"AI-"+(100+ ++S.n),name:f.get("n"),dept:f.get("d"),owner:"Role: Business owner",pri:"Medium",value:+f.get("v")||0,stage:"Discovery",gov:"Submitted",prog:0,cat:"Business Process Automation",score:60,real:0});S.act.unshift("New AI opportunity submitted: "+f.get("n"));setTimeout(render,50);toast("Opportunity added to the portfolio");return true});
else if(a==="score"){e.preventDefault();const b=[["Business impact",i.score+6],["Feasibility",i.score-4],["Data readiness",i.score-10],["Strategic alignment",i.score+3],["Governance ease",i.score-8]];D.innerHTML=`<h3>${esc(i.name)}: demo score ${i.score}</h3>${bars(b,"#7c5cff")}<p class="sub">Illustrative framework only. Business review decides.</p><form method="dialog"><button class="b">Close</button></form>`;D.showModal()}
else if(a==="approve"){form("Record human approval",`<label>Reviewer name (required)<input name="r"></label><label>Decision note<input name="n"></label>`,f=>{if(!f.get("r").trim()){$("#er").textContent="A named reviewer must record approval.";return false}i.gov="Approved";i.stage="Design";i.prog=Math.max(i.prog,30);S.act.unshift("Governance assessment completed: "+i.name+" approved by "+f.get("r"));setTimeout(render,50);toast("Approved by "+f.get("r")+". Entered the implementation pipeline at Design.");return true})}
else if(a==="changes"){i.gov="Changes Requested";S.act.unshift("Changes requested: "+i.name);render();toast("Changes requested")}
else if(a==="adv"){const n=STG[Math.min(STG.indexOf(i.stage)+1,7)];if(n==="Monitoring"&&i.stage==="Deployment Review"&&!confirm("A human approver confirms the deployment decision for "+i.name+"?"))return;mv(id,n)}
else if(a==="outcome")form("Record outcome: "+i.name,`<label>Realized value to date ($k)<input name="v" type="number" value="${i.real}"></label>`,f=>{const v=+f.get("v");if(isNaN(v)||v<0){$("#er").textContent="Enter 0 or more.";return false}i.real=v;S.act.unshift("Business impact review: outcome recorded for "+i.name);setTimeout(render,50);toast("Outcome recorded");return true});
else if(a==="camp")form("Create training campaign",`<label>Campaign name<input name="n"></label><label>Course<select><option>Responsible AI</option><option>Prompt Engineering</option><option>AI Fundamentals</option></select></label>`,f=>{if(f.get("n").trim().length<3){$("#er").textContent="Enter a campaign name.";return false}S.act.unshift("Employee training campaign created: "+f.get("n"));toast("Campaign created (demo)");return true})});
render();
</script></body></html>
